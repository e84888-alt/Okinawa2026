<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026麥子必旅-沖繩</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Montserrat:wght@700;900&display=swap');
        body { font-family: 'Noto Sans TC', 'Montserrat', sans-serif; background-color: #f0f6fc; color: #1e293b; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .top-dashboard { position: sticky; top: 0; z-index: 1000; background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 10px 16px; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-family: 'Montserrat', sans-serif; font-weight: 900; font-style: italic; color: white; font-size: 14px; letter-spacing: -1px; }
        .weather-pill { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); border-radius: 50px; padding: 4px 10px; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .val-time { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 12px; color: #fff; }
        .val-temp { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 10px; color: rgba(255,255,255,0.7); }
        .label-city { font-size: 8px; font-weight: 900; color: rgba(255,255,255,0.5); }
        .sticky-tabs { background: rgba(255, 255, 255, 0.98); border-bottom: 1px solid #e2e8f0; padding: 6px 16px; display: flex; gap: 4px; position: sticky; top: 44px; z-index: 999; overflow-x: auto; }
        .tab-btn { flex: 0 0 60px; padding: 8px 0; border-radius: 12px; font-size: 11px; font-weight: 900; color: #94a3b8; transition: all 0.2s; text-align: center; }
        .tab-active { background: #ffbf00; color: #1e3a8a; box-shadow: 0 4px 10px rgba(255, 191, 0, 0.3); transform: scale(1.05); }
        .itinerary-card { background: white; border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid #fff; transition: transform 0.2s; }
        .card-play { border-left: 5px solid #10b981; }
        .card-food { border-left: 5px solid #f59e0b; }
        .card-stay { border-left: 5px solid #6366f1; }
        .card-shop { border-left: 5px solid #ec4899; }
        .card-transport { border-left: 5px solid #0ea5e9; }
        .logistics-wrap { position: relative; padding-left: 2rem; margin: 1rem 0; }
        .logistics-wrap::before { content: ''; position: absolute; left: 0.8rem; top: -1rem; bottom: -1rem; width: 2px; background: #e2e8f0; }
        .time-pill { background: #fff; border: 1.5px solid #e0f2fe; color: #3b82f6; font-size: 9px; font-weight: 900; padding: 1px 8px; border-radius: 50px; margin-bottom: 4px; display: inline-block; font-family: 'Montserrat', sans-serif; }
        .day-content { display: none; }
        .day-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">

    <div class="top-dashboard">
        <div class="header-content">
            <div class="logo-text">OKINAWA 2026</div>
            <div class="flex gap-2">
                <div class="weather-pill"><span class="label-city">TPE</span><span id="time-tpe" class="val-time">--:--</span><span id="temp-tpe" class="val-temp">--°</span></div>
                <div class="weather-pill"><span class="label-city">OKA</span><span id="time-oka" class="val-time">--:--</span><span id="temp-oka" class="val-temp">--°</span></div>
            </div>
        </div>
    </div>

    <nav class="sticky-tabs no-scrollbar">
        <div id="day-tabs" class="flex w-full justify-between gap-1"></div>
    </nav>

    <main id="main-content" class="px-5 mt-6 max-w-md mx-auto"></main>

    <div id="info-modal" class="fixed inset-0 bg-black/70 z-[2000] hidden items-end justify-center backdrop-blur-sm" onclick="closeInfo()">
        <div class="bg-white rounded-t-[2.5rem] w-full max-w-md p-8 shadow-2xl" onclick="event.stopPropagation()">
            <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-6"></div>
            <h3 id="modal-title" class="text-xl font-black text-slate-800 mb-2"></h3>
            <p id="modal-desc" class="text-slate-500 text-sm leading-relaxed mb-8"></p>
            <a id="modal-map" href="" target="_blank" class="flex items-center justify-center gap-3 w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg"><i class="fas fa-location-arrow"></i> 開啟地圖導航</a>
        </div>
    </div>

    <div class="fixed bottom-6 left-0 right-0 px-8 flex justify-between items-end pointer-events-none z-[1000]">
        <button onclick="openRescue()" class="pointer-events-auto w-14 h-14 bg-rose-500 text-white rounded-2xl shadow-xl flex items-center justify-center text-xl active:scale-90 border-4 border-white"><i class="fas fa-baby"></i></button>
        <button onclick="openExchange()" class="pointer-events-auto w-14 h-14 bg-blue-600 text-white rounded-2xl shadow-xl flex items-center justify-center text-xl active:scale-90 border-4 border-white"><i class="fas fa-yen-sign"></i></button>
    </div>

    <div id="rescue-modal" class="fixed inset-0 bg-black/60 z-[2000] hidden items-end justify-center" onclick="this.classList.add('hidden')">
        <div class="bg-white rounded-t-[2.5rem] p-8 pb-12 w-full max-w-md" onclick="event.stopPropagation()"><h3 class="text-xl font-black text-rose-500 mb-6 italic flex items-center gap-2"><i class="fas fa-baby"></i> 育兒救援卡</h3><div class="grid gap-3"><button onclick="showJP('哺乳室？','授乳室はどこにありますか？')" class="w-full text-left p-4 bg-rose-50 rounded-xl font-black text-rose-700">尋找哺乳室</button><button onclick="showJP('需要熱水','粉ミルク用のお湯をいただけますか？')" class="w-full text-left p-4 bg-sky-50 rounded-xl font-black text-sky-700">需要熱水泡奶</button><button onclick="showJP('嬰兒座椅','ベビーチェアはありますか？')" class="w-full text-left p-4 bg-amber-50 rounded-xl font-black text-amber-700">有嬰兒座椅嗎？</button></div></div>
    </div>
    <div id="exchange-modal" class="fixed inset-0 bg-black/60 z-[2000] hidden items-center justify-center px-6" onclick="this.classList.add('hidden')">
        <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-xs text-center" onclick="event.stopPropagation()"><h3 class="font-black text-lg mb-6">JPY ➔ TWD</h3><input type="number" id="jpy-input" oninput="convertCurr()" placeholder="輸入日幣" class="w-full bg-slate-100 p-5 rounded-2xl text-3xl font-black text-blue-600 text-center outline-none"><p id="twd-output" class="text-xl font-black text-slate-400 mt-6 tracking-tight">約 NT$ 0</p></div>
    </div>
    <div id="jp-modal" class="fixed inset-0 bg-black/95 z-[3000] hidden items-center justify-center p-8" onclick="this.classList.add('hidden')">
        <div class="text-center"><p id="jp-tw" class="text-white/40 text-sm font-bold mb-4 uppercase"></p><p id="jp-text" class="text-4xl font-black text-white leading-snug"></p></div>
    </div>

    <script>
        const itineraryData = [
            {
                day: 1, date: "9/14",
                events: [
                    { time: "12:20", type: "logistics", title: "抵達那霸機場 (MM922)", icon: "fa-plane-arrival" },
                    { time: "13:20", type: "logistics", title: "租車接駁與辦理領車", icon: "fa-key" },
                    { time: "14:20", type: "transport", title: "關鍵動作：汽座安裝", desc: "5 台車安裝汽座、檢查車況、同步導航。", icon: "fa-child-reaching" },
                    { time: "15:20-15:35", type: "logistics", title: "前往瀨長島 (15分鐘)", icon: "fa-road" },
                    { time: "15:35", type: "food", title: "瀨長島 Umikaji Terrace", desc: "下午茶、看飛機，讓寶寶下飛機後伸展一下。", icon: "fa-ice-cream", map: "https://www.google.com/maps/search/瀨長島+Umikaji+Terrace" },
                    { time: "17:00-17:20", type: "logistics", title: "前往新都心 (20分鐘)", icon: "fa-road" },
                    { time: "17:20", type: "shop", title: "西松屋 那霸新都心店", desc: "買齊五天份尿布與濕紙巾。", icon: "fa-shopping-basket", map: "https://www.google.com/maps/search/西松屋+那霸新都心店" },
                    { time: "18:20-19:20", type: "logistics", title: "前往恩納村 (走高速公路)", icon: "fa-car" },
                    { time: "19:20", type: "stay", title: "Hotel Sunset Hill 入住", desc: "辦理入住，買超市宵夜慶祝第一晚。", icon: "fa-hotel", map: "https://www.google.com/maps/search/?api=1&query=Hotel+Sunset+Hill+沖繩" }
                ]
            },
            {
                day: 2, date: "9/15",
                events: [
                    { time: "08:00", type: "food", title: "飯店早餐時刻", desc: "在 Hotel Sunset Hill 享用早餐補滿體力。", icon: "fa-bread-slice" },
                    { time: "09:30-10:15", type: "logistics", title: "前往樂園 (45分鐘)", icon: "fa-road" },
                    { time: "10:15", type: "play", title: "JUNGLIA 叢林樂園", desc: "2025新景點，大部隊放電首選。", icon: "fa-tree", map: "https://www.google.com/maps/search/JUNGLIA" },
                    { time: "16:00-16:40", type: "logistics", title: "前往名護市區", icon: "fa-road" },
                    { time: "16:40", type: "food", title: "名護市區燒肉大餐", desc: "慶祝畢業第一餐！", icon: "fa-fire", map: "https://www.google.com/maps/search/名護市區+燒肉" },
                    { time: "18:40-19:20", type: "logistics", title: "返回恩納村", icon: "fa-road" },
                    { time: "19:20", type: "stay", title: "Hotel Sunset Hill 休息", desc: "享受飯店晚間時光。", icon: "fa-moon" }
                ]
            },
            {
                day: 3, date: "9/16",
                events: [
                    { time: "08:30-09:30", type: "stay", title: "飯店退房 & 行李裝載", desc: "從 Hotel Sunset Hill 辦理退房。WB 載貨、HS 載人。", icon: "fa-boxes-packing" },
                    { time: "09:30-10:30", type: "logistics", title: "前往北部本部町", icon: "fa-road" },
                    { time: "10:30-13:30", type: "play", title: "美麗海水族館", desc: "黑潮之水震撼，寶寶看大魚最安心。", icon: "fa-fish", map: "https://www.google.com/maps/search/美麗海水族館" },
                    { time: "13:30-14:00", type: "logistics", title: "前往古宇利島", icon: "fa-road" },
                    { time: "14:00-15:30", type: "play", title: "古宇利大橋 & 心形岩", desc: "拍團體大合照聖地。", icon: "fa-camera", map: "https://www.google.com/maps/search/古宇利島+心形岩" },
                    { time: "15:30-16:50", type: "logistics", title: "長程移動至美國村", icon: "fa-car-side" },
                    { time: "16:50-18:50", type: "play", title: "美濱美國村", desc: "看夕陽、逛街、吃晚餐。", icon: "fa-sun", map: "https://www.google.com/maps/search/美濱美國村" },
                    { time: "18:50-19:30", type: "logistics", title: "前往那霸市中心", icon: "fa-road" },
                    { time: "19:30", type: "stay", title: "那霸市區飯店 入住", desc: "最後兩晚的據點。", icon: "fa-hotel" }
                ]
            },
            {
                day: 4, date: "9/17",
                events: [
                    { time: "08:30-08:50", type: "logistics", title: "往泊港市場", icon: "fa-road" },
                    { time: "08:50", type: "food", title: "泊港魚市場早餐", desc: "生魚片、烤魚、Potama 飯糰。", icon: "fa-fish-fins", map: "https://www.google.com/maps/search/泊港魚市場" },
                    { time: "10:00-10:30", type: "logistics", title: "往首里城", icon: "fa-road" },
                    { time: "10:30-12:30", type: "play", title: "首里城公園", desc: "古蹟散步，消耗小孩體力。", icon: "fa-torii-gate", map: "https://www.google.com/maps/search/首里城" },
                    { time: "12:30-13:10", type: "logistics", title: "往沖繩世界", icon: "fa-road" },
                    { time: "13:10-15:40", type: "play", title: "沖繩世界 (玉泉洞)", desc: "鐘乳石洞、看太鼓表演。", icon: "fa-gem", map: "https://www.google.com/maps/search/沖繩世界" },
                    { time: "15:40-16:20", type: "logistics", title: "返回國際通", icon: "fa-road" },
                    { time: "16:20-18:30", type: "shop", title: "國際通大採買", desc: "藥妝土產最後補齊。", icon: "fa-bag-shopping", map: "https://www.google.com/maps/search/那霸國際通" },
                    { time: "18:30-20:30", type: "food", title: "畢業旅行最後大餐", desc: "建議預訂大空間餐廳。", icon: "fa-utensils" }
                ]
            },
            {
                day: 5, date: "9/18",
                events: [
                    { time: "09:00-10:30", type: "stay", title: "飯店悠閒早餐", desc: "最後行李整理與塞車。", icon: "fa-bread-slice" },
                    { time: "10:30-11:10", type: "logistics", title: "往租車公司附近", icon: "fa-road" },
                    { time: "11:10-12:10", type: "transport", title: "歸還車輛", desc: "5 台車確認車況與歸還。", icon: "fa-key" },
                    { time: "12:10-12:40", type: "logistics", title: "接駁至機場", icon: "fa-bus" },
                    { time: "12:40-14:00", type: "food", title: "機場國內線採買", desc: "最後大採購、吃飯糰。", icon: "fa-cart-shopping", map: "https://www.google.com/maps/search/那霸機場+國內線" },
                    { time: "14:00-16:00", type: "logistics", title: "MM929 報到入關", icon: "fa-passport" },
                    { time: "16:00", type: "transport", title: "飛機起飛歸途", desc: "回到溫暖的家！", icon: "fa-plane-up" }
                ]
            }
        ];

        function renderUI() {
            const tabs = document.getElementById('day-tabs');
            const main = document.getElementById('main-content');
            itineraryData.forEach((d, idx) => {
                const btn = document.createElement('button');
                btn.id = `btn-${d.day}`;
                btn.className = `tab-btn ${idx===0?'tab-active':''}`;
                btn.innerHTML = `Day ${d.day}<span class="block text-[8px] font-normal opacity-50 mt-0.5">${d.date}</span>`;
                btn.onclick = () => showDay(d.day);
                tabs.appendChild(btn);

                const section = document.createElement('div');
                section.id = `day-${d.day}`;
                section.className = `day-content ${idx===0?'active':''}`;
                d.events.forEach(e => {
                    if (e.type === 'logistics') {
                        section.innerHTML += `<div class="logistics-wrap"><span class="time-pill">${e.time}</span><div class="text-[10px] font-black text-slate-400 flex items-center gap-2"><i class="fas ${e.icon} opacity-30"></i> ${e.title}</div></div>`;
                    } else {
                        section.innerHTML += `<div onclick="openInfo('${e.title}','','${e.desc}','${e.map||''}')" class="itinerary-card card-${e.type} cursor-pointer"><div class="flex gap-4"><div class="w-11 h-11 rounded-xl bg-slate-50 flex items-center justify-center text-slate-400 shrink-0 shadow-inner"><i class="fas ${e.icon} text-base"></i></div><div class="flex-1 min-w-0"><span class="text-[9px] font-black text-blue-500 uppercase tracking-widest">${e.time}</span><h3 class="font-black text-slate-800 text-base tracking-tight truncate mt-0.5">${e.title}</h3><p class="text-[11px] text-slate-400 mt-0.5 font-medium leading-relaxed">${e.desc || ''}</p></div></div></div>`;
                    }
                });
                main.appendChild(section);
            });
        }

        let JPY_RATE = 0.212;
        async function updateExchangeRate() { try { const res = await fetch('https://open.er-api.com/v6/latest/JPY'); const data = await res.json(); if(data.rates.TWD) JPY_RATE = data.rates.TWD; } catch(e) {} }
        function convertCurr() { const jpy = document.getElementById('jpy-input').value; document.getElementById('twd-output').innerText = jpy ? `約 NT$ ${Math.round(jpy * JPY_RATE).toLocaleString()}` : "約 NT$ 0"; }
        function openInfo(t,i,d,m) { document.getElementById('modal-title').innerText=t; document.getElementById('modal-desc').innerText=d; document.getElementById('modal-map').href=m; document.getElementById('info-modal').classList.remove('hidden'); document.getElementById('info-modal').classList.add('flex'); }
        function closeInfo() { document.getElementById('info-modal').classList.add('hidden'); document.getElementById('info-modal').classList.remove('flex'); }
        function openRescue() { document.getElementById('rescue-modal').classList.remove('hidden'); document.getElementById('rescue-modal').classList.add('flex'); }
        function openExchange() { document.getElementById('exchange-modal').classList.remove('hidden'); document.getElementById('exchange-modal').classList.add('flex'); setTimeout(()=>document.getElementById('jpy-input').focus(),300); }
        function showJP(tw, jp) { document.getElementById('jp-tw').innerText=tw; document.getElementById('jp-text').innerText=jp; document.getElementById('jp-modal').classList.remove('hidden'); document.getElementById('jp-modal').classList.add('flex'); }
        function showDay(dayNum) {
            document.querySelectorAll('.day-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`day-${dayNum}`).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('tab-active'));
            document.getElementById(`btn-${dayNum}`).classList.add('tab-active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        async function updateWeather() {
            const fetchW = async (city, id) => { try { const res = await fetch(`https://wttr.in/${city}?format=%25t`); const t = await res.text(); document.getElementById(id).innerText = t.replace('+', ''); } catch(e){} };
            fetchW('Taipei', 'temp-tpe'); fetchW('Okinawa', 'temp-oka');
        }
        function updateClocks() {
            const opt = { hour:'2-digit', minute:'2-digit', hour12:false };
            document.getElementById('time-tpe').innerText = new Intl.DateTimeFormat('en-US', {...opt, timeZone:'Asia/Taipei'}).format(new Date());
            document.getElementById('time-oka').innerText = new Intl.DateTimeFormat('en-US', {...opt, timeZone:'Asia/Tokyo'}).format(new Date());
        }

        renderUI(); updateClocks(); setInterval(updateClocks, 1000); updateWeather(); updateExchangeRate();
    </script>
</body>
</html>
