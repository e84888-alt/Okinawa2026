<script>
    // 預設匯率 (當網路斷線或 API 失效時使用)
    let JPY_RATE = 0.21; 

    // 自動從 API 抓取最新匯率 (使用 exchangerate-api)
    async function updateExchangeRate() {
        try {
            // 抓取日圓對台幣的匯率
            const response = await fetch('https://open.er-api.com/v6/latest/JPY');
            const data = await response.json();
            
            if (data && data.rates && data.rates.TWD) {
                // 取得最新的 TWD 匯率
                JPY_RATE = data.rates.TWD.toFixed(4);
                
                // 更新介面上的顯示文字（可選）
                document.getElementById('rate-info').innerText = `目前自動匯率：${JPY_RATE}`;
                console.log("匯率更新成功:", JPY_RATE);
            }
        } catch (error) {
            console.log("無法取得即時匯率，使用預設值:", JPY_RATE);
            document.getElementById('rate-info').innerText = `使用預設匯率：${JPY_RATE} (離線)`;
        }
    }

    // 頁面載入時執行更新
    updateExchangeRate();

    // 換算功能邏輯
    function convertCurrency() {
        const jpy = document.getElementById('jpy-input').value;
        const twd = Math.round(jpy * JPY_RATE);
        document.getElementById('twd-output').innerText = `約 NT$ ${twd.toLocaleString()}`;
    }

    // --- 以下保持原有的功能函數 ---
    function openRescue() { document.getElementById('rescue-modal').style.display = 'flex'; }
    function closeRescue() { document.getElementById('rescue-modal').style.display = 'none'; }
    function showJapanese(tw, jp) {
        document.getElementById('jp-card-tw').innerText = tw;
        document.getElementById('jp-card-text').innerText = jp;
        document.getElementById('jp-card-modal').style.display = 'flex';
    }
    function closeJP() { document.getElementById('jp-card-modal').style.display = 'none'; }
    function openExchange() { 
        document.getElementById('exchange-modal').style.display = 'flex';
        setTimeout(() => document.getElementById('jpy-input').focus(), 100);
    }
    function closeExchange() { document.getElementById('exchange-modal').style.display = 'none'; }
    function showDay(day) {
        document.querySelectorAll('.day-content').forEach(el => el.classList.remove('active'));
        document.getElementById('day-' + day).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(el => {
            el.classList.remove('tab-active');
            el.classList.add('text-slate-400');
        });
        document.getElementById('btn-' + day).classList.add('tab-active');
        document.getElementById('btn-' + day).classList.remove('text-slate-400');
    }
</script>
