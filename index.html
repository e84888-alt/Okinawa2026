<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026麥子必旅-沖繩</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .day-content { display: none; }
        .day-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .tab-active { color: #3b82f6; border-bottom: 4px solid #3b82f6; font-weight: bold; }
        #photo-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; backdrop-blur: 5px; }
    </style>
</head>
<body class="bg-gray-100 pb-24">

    <div id="photo-modal" onclick="closeModal()">
        <div class="bg-white rounded-3xl overflow-hidden max-w-sm w-full shadow-2xl" onclick="event.stopPropagation()">
            <img id="modal-img" src="" class="w-full h-56 object-cover bg-gray-200">
            <div class="p-6">
                <h3 id="modal-title" class="text-xl font-bold text-gray-800"></h3>
                <p id="modal-desc" class="text-sm text-gray-500 mt-2"></p>
                <a id="modal-map" href="#" target="_blank" class="mt-6 flex items-center justify-center gap-2 w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg">
                    <i class="fas fa-map-marker-alt"></i> 開啟 Google 地圖導航
                </a>
            </div>
        </div>
    </div>

    <header class="bg-slate-800 text-white p-6 shadow-md">
        <h1 class="text-xl font-bold">Okinawa 2026</h1>
        <p class="text-xs opacity-70">9/14 - 9/18 樂桃 MM922 / MM929</p>
    </header>

    <nav class="sticky top-0 bg-white border-b flex justify-around z-50">
        <button onclick="showDay(1)" id="btn-1" class="py-4 px-2 tab-active text-xs">9/14(一)</button>
        <button onclick="showDay(2)" id="btn-2" class="py-4 px-2 text-gray-400 text-xs">9/15</button>
        <button onclick="showDay(3)" id="btn-3" class="py-4 px-2 text-gray-400 text-xs">9/16</button>
        <button onclick="showDay(4)" id="btn-4" class="py-4 px-2 text-gray-400 text-xs">9/17</button>
        <button onclick="showDay(5)" id="btn-5" class="py-4 px-2 text-gray-400 text-xs">9/18</button>
    </nav>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <div id="day-1" class="day-content active space-y-4">
            <div onclick="openModal('桃園國際機場', 'https://placehold.co/600x400?text=TPE+Airport', 'MM922 預計 12:30 起飛。建議 09:30 抵達辦理報到。', 'https://www.google.com/maps/search/?api=1&query=桃園國際機場')" 
                 class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-blue-500 cursor-pointer active:bg-gray-50">
                <div class="font-bold text-gray-800">09:30 桃園機場報到</div>
                <div class="text-[10px] text-gray-400 mt-1">點擊查看詳情與導航</div>
            </div>

            <div onclick="openModal('Hotel Sunset Hill', 'https://placehold.co/600x400?text=Sunset+Hill+View', '恩納村海景飯店。設有小廚房與微波爐，方便處理寶寶副食品。', 'https://www.google.com/maps/search/?api=1&query=Hotel+Sunset+Hill+Okinawa')"
                 class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-orange-400 cursor-pointer active:bg-gray-50">
                <div class="font-bold text-gray-800">入住 Hotel Sunset Hill</div>
                <div class="text-[10px] text-gray-400 mt-1">點擊查看詳情與導航</div>
            </div>
        </div>

        <div id="day-3" class="day-content space-y-4">
            <div onclick="openModal('OMO5 Okinawa Naha', 'https://placehold.co/600x400?text=OMO5+Naha', '星野集團飯店。位於市中心，周邊美食豐富，設有 OMO Base 休息區。', 'https://www.google.com/maps/search/?api=1&query=OMO5+Okinawa+Naha')"
                 class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-indigo-600 cursor-pointer active:bg-gray-50">
                <div class="font-bold text-gray-800">入住 OMO5 Okinawa Naha</div>
                <div class="text-[10px] text-gray-400 mt-1">點擊查看詳情與導航</div>
            </div>
        </div>

        <div id="day-5" class="day-content space-y-4">
            <div onclick="openModal('那霸機場', 'https://placehold.co/600x400?text=Naha+Airport', 'MM929 預計 15:55 起飛。建議 12:30 抵達報到。', 'https://www.google.com/maps/search/?api=1&query=Naha+Airport')"
                 class="bg-slate-800 text-white p-5 rounded-2xl shadow-lg cursor-pointer">
                <div class="font-bold">12:30 那霸機場報到</div>
                <div class="text-[10px] text-gray-400 mt-1">點擊查看詳情與導航</div>
            </div>
        </div>

    </main>

    <script>
        function openModal(title, imgSrc, desc, mapLink) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-img').src = imgSrc;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-map').href = mapLink;
            document.getElementById('photo-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('photo-modal').style.display = 'none'; }
        function showDay(day) {
            document.querySelectorAll('.day-content').forEach(el => el.classList.remove('active'));
            document.getElementById('day-' + day).classList.add('active');
            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('tab-active');
                el.classList.add('text-gray-400');
            });
            document.getElementById('btn-' + day).classList.add('tab-active');
            document.getElementById('btn-' + day).classList.remove('text-gray-400');
        }
    </script>
</body>
</html>
