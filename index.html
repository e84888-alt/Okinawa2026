<!DOCTYPE html>
<html lang="zh-TW">
<head>

        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f0f9ff; }
        .day-content { display: none; }
        .day-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tab-btn { transition: all 0.2s; border-radius: 99px; }
        .tab-active { background-color: #f59e0b; color: white; font-weight: 900; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); }
        .logistics-text { font-size: 10px; color: #94a3b8; font-weight: 500; }
        .logistics-line { border-left: 2px dashed #cbd5e1; margin-left: 19px; padding: 8px 0 8px 25px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; backdrop-blur: 8px; }
        .card-active:active { transform: scale(0.98); }
    </style>
</head>
